# Netlify serves the frontend folder as static assets
[build]
  publish = "frontend" 

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CAFE_COLLECTION,CAFE_DATABASE,PORT,USER_INPUT_COLLECTION,USER_INPUT_DATABASE"

# Netlify will run Express as a serverless function.
[functions]
  directory = "backend/functions"
  external_node_modules = ["express", "mongodb"]
  node_bundler = "esbuild" 

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

